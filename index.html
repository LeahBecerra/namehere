<!DOCTYPE html>
<html>

<head>
	<title>ADD YOUR WEBSITE TITLE HERE</title>
	<meta charset="UTF-8"> 
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

	<style>
		
		body {
			max-width: 1200px;
			margin: 0 auto;
		}

		.cardinfo {
			width: 100%;
			display: flex;
		}

		.cardtext {
			width: 60%;
		}

		.cardtext h4 {
			font-family: "Old Standard TT", serif;
			font-size: 50px;
			letter-spacing: -.05rem;
			line-height: 1;
		}

		.cardtext p {
			font-family: "Dosis", sans-serif;
			font-size: 1.25rem;
		}

		.cardimage {
			width: 40%;
		}

		.cardimage img {
			width: 100%;
		}

		@media (max-width: 600px) {
			.cardinfo {
				flex-direction: column;
			}
			.cardtext {
				width: 100%;
			}

			.cardimage {
				width: 100%;
			}

		}


	</style>

</head>


<body>

	<header>
		
	</header>

	<main>

		<div class="cardinfo">
			<div class="cardtext">
				<h4>This is a headline</h4>
				<p>Here's some text to make a longer sentence. TK TK TK.</p>
			</div>
			<div class="cardimage">
				<img src="img/box-cat.jpeg" alt="Cat in a box.">
			</div>
		</div>
		
	</main>

	<footer>
		
	</footer>
	
</body>

</html>
